<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator{
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        #display{
            width: 100%;
            height: 60px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding-right: 10px;
            border: none;
            border-radius: 5px;
        }

        .buttons{
            display: grid;
            grid-template-columns: repeat(5, 70px);
            gap: 5px;
        }

        button{
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            opacity: 0.8;
        }

        .operator{
            background-color: orange;
            color: white;
        }

        .function{
            background-color: #555;
            color: white;
        }

        .number{
            background-color: #ddd;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly>

    <div class="buttons">
        <button class="function">sin</button>
        <button class="function">cos</button>
        <button class="function">tan</button>
        <button class="function">log</button>
        <button class="function">√</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">/</button>
        <button class="function">x²</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">*</button>
        <button class="function">x³</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">-</button>
        <button class="function">π</button>

        <button class="number">0</button>
        <button class="number">.</button>
        <button class="operator">+</button>
        <button class="operator">=</button>
        <button class="function">e</button>

        <button class="function">C</button>
        <button class="function">(</button>
        <button class="function">)</button>
        <button class="function">%</button>
        <button class="function">^</button>
    </div>
</div>

</body>
</html>
